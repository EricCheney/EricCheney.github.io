<section class="contact-section" id="contact">

        <p>I’m seeking full-time mechanical and thermal engineering roles starting after my May 2027 graduation.</p>

            <a href="{{ site.linkedin_url }}" target="_blank" rel="noreferrer">LinkedIn ↗</a>

    </div>
</section>
