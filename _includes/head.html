<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.site_title }}</title>
    <meta name="description" content="{{ site.description }}">
    <meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
    <meta name="color-scheme" content="dark light">
    <link rel="canonical" href="{{ site.url }}{{ page.url }}">

    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ site.site_title }}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:image" content="{{ site.url }}/assets/images/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Eric Cheney — Thermal and Mechanical Engineering">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ site.site_title }}">
    <meta name="twitter:description" content="{{ site.description }}">
    <meta name="twitter:image" content="{{ site.url }}/assets/images/og.png">
    <meta name="twitter:image:alt" content="Eric Cheney — Thermal and Mechanical Engineering">

    <script>
        (function () {
            var theme;
            try { theme = localStorage.getItem('theme'); } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
            document.documentElement.dataset.theme = theme;
            document.documentElement.classList.add('js');
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@1&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
    <link rel="alternate icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
</head>
